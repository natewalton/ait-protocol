name: AIT release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a draft or publish an inspected draft
        required: true
        type: choice
        options: [prepare, publish]
      version:
        description: SemVer without v; the peer branch uses a -peer.N prerelease
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: ait-release
  cancel-in-progress: false

jobs:
  validate:
    if: (inputs.operation == 'prepare' || inputs.operation == 'publish') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/private-peer-integration')
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            plc/package-lock.json
            pds/package-lock.json
            appview/package-lock.json
            mcp/package-lock.json
      - name: Assess supported releases during preparation
        if: inputs.operation == 'prepare'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { loadPolicy, checkCandidate } from './bin/check-advisories.mjs';
          const git = args => execFileSync('git', args, { encoding: 'utf8', timeout: 60000 }).trim();
          const policy = loadPolicy(process.cwd());
          if (!policy.supportedReleases.length) throw Error('supported release inventory is empty');
          for (const release of policy.supportedReleases) {
            const ref = `refs/ait-security/${release.tag}`;
            git(['fetch', '--no-tags', 'origin', `refs/tags/${release.tag}:${ref}`]);
            if (git(['rev-parse', `${ref}^{commit}`]) !== release.commit) throw Error(`moved supported tag: ${release.tag}`);
            const directory = path.join(process.env.RUNNER_TEMP, `security-${release.tag}`);
            git(['worktree', 'add', '--detach', directory, release.commit]);
            try {
              // Lock/native audits require no dependency installation or execution
              // of the historical tag's checker, policy or lifecycle scripts.
              const report = await checkCandidate(directory);
              console.log(JSON.stringify({ supportedTag: release.tag, ...report }));
              if (Object.keys(report.scannerTotals).length !== 4 || report.native?.status !== 'complete' || report.native.errors.length) throw Error(`incomplete supported-release audit: ${release.tag}`);
              const highs = Object.values(report.scannerTotals).reduce((sum, totals) => sum + totals.high + totals.critical, 0);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n${release.tag}: ${report.status}; ${highs} High/Critical affected-package findings. See assessment log for findings and unverified runtime regressions.\n`);
              // Older findings are reported, never used to waive candidate blockers.
            } finally { git(['worktree', 'remove', '--force', directory]); }
          }
          NODE
      - name: Validate candidate and run gates
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          else
            printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-peer\.[1-9][0-9]*$'
            test "$(uname -m)" = arm64
          fi
          test "$(cat VERSION)" = "$RELEASE_VERSION"
          git fetch --quiet origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/$GITHUB_REF_NAME")"
          for f in install.sh ait bin/install.sh bin/update.sh bin/uninstall.sh \
            bin/lib-mcp-holders.sh bin/lib-service-pids.sh \
            bin/ait-update-test.sh bin/ait-uninstall-test.sh; do
            bash -n "$f"   # one file per call: bash -n parses only its first operand
          done
          bin/ait-test.sh
          bin/ait-uninstall-test.sh
          bin/ait-update-test.sh
          npm --prefix plc ci --prefer-offline --no-audit
          npm --prefix pds ci --prefer-offline --no-audit
          npm --prefix appview ci --prefer-offline --no-audit
          npm --prefix mcp ci --prefer-offline --no-audit
          node pds/scripts/xml-parser-test.cjs
          npm --prefix appview run build
          node appview/scripts/duplicate-follow-test.mjs
          npm --prefix mcp run build
          node mcp/scripts/push-mode-test.mjs
          node mcp/scripts/codex-writer-ownership-test.mjs
          node mcp/scripts/session-picker-test.mjs
          if [ "$GITHUB_REF" = refs/heads/build/private-peer-integration ]; then
            (cd appview && node scripts/operator-identity-test.mjs)
            (cd appview && node scripts/startup-readiness-test.mjs)
            (cd appview && node --import tsx scripts/peer-projection-test.mjs)
            (cd appview && node --import tsx scripts/peer-feed-test.mjs)
            (cd appview && node --import tsx scripts/peer-lifecycle-test.mjs)
            (cd mcp && node scripts/handles-test.mjs)
            (cd mcp && node --import tsx scripts/peer-mentions-test.mjs)
            brew list --versions postgresql@17 >/dev/null || brew install postgresql@17
            node appview/scripts/peer-link-test.mjs
            npm install --prefix "$RUNNER_TEMP/iroh-stock" --no-audit --no-fund @number0/iroh@1.2.0
            IROH_STOCK_BINDING="$RUNNER_TEMP/iroh-stock/node_modules/@number0/iroh/index.js" node appview/scripts/peer-link-test.mjs --policy-controls
            node appview/scripts/peer-link-test.mjs --connect-bound
          fi
          bin/run-codex-appserver-test.sh
          node mcp/scripts/codex-sink-test.mjs
          node mcp/scripts/codex-recovery-test.mjs
          bin/codex-native-contract-test.sh
          bin/check-single-lexicon.sh
          node pds/scripts/mailer-security-test.mjs
          node bin/check-advisories-test.mjs
          node bin/security-workflow-test.mjs
          node bin/check-native-advisories-test.mjs
          GITHUB_TOKEN="${{ github.token }}" bin/check-advisories.sh --candidate "$GITHUB_WORKSPACE"

  release:
    needs: validate
    if: needs.validate.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/private-peer-integration')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact release asset
        id: asset
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          git fetch --quiet origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/$GITHUB_REF_NAME")"
          asset="$RUNNER_TEMP/install.sh"
          sed -e "s/__AIT_RELEASE_TAG__/$tag/g" \
              -e "s/__AIT_RELEASE_COMMIT__/$(git rev-parse HEAD)/g" \
              install.sh > "$asset"
          chmod 700 "$asset"
          ! grep -Fq '__AIT_RELEASE_' "$asset"
          bash -n "$asset"
          "$asset" --verify-only
          test -s "$asset"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Gate immutable release settings and ancestry
        if: env.RELEASE_OPERATION == 'prepare'
        env:
          RELEASE_TAG: ${{ steps.asset.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          latest_json="$RUNNER_TEMP/latest-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$latest_json"
          if [ "$GITHUB_REF_NAME" = build/private-peer-integration ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.prerelease and (.draft | not) and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-peer\\.[1-9][0-9]*$")))] | first' > "$RUNNER_TEMP/previous-channel.json"
          else
            cp "$latest_json" "$RUNNER_TEMP/previous-channel.json"
          fi
          previous_release="$(node - "$RUNNER_TEMP/previous-channel.json" <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const peer = process.env.GITHUB_REF_NAME === 'build/private-peer-integration';
          const version = peer ? /^v[0-9]+\.[0-9]+\.[0-9]+-peer\.[1-9][0-9]*$/ : /^v[0-9]+\.[0-9]+\.[0-9]+$/;
          if (!r || !version.test(r.tag_name || '') || !/^[0-9a-f]{40}$/.test(r.target_commitish || '') || r.draft || r.prerelease !== peer || r.immutable !== true) process.exit(1);
          process.stdout.write(`${r.tag_name}\t${r.target_commitish}`);
          NODE
            )"
            previous_tag="${previous_release%%$'\t'*}"
            previous_commit="${previous_release#*$'\t'}"
            git fetch --quiet origin "refs/tags/$previous_tag:refs/ait-release-ancestry/$previous_tag"
            test "$(git rev-parse "refs/ait-release-ancestry/$previous_tag^{commit}")" = "$previous_commit"
            git merge-base --is-ancestor "$previous_commit" HEAD
      - name: Refuse migration-surface changes
        if: env.RELEASE_OPERATION == 'prepare'
        run: |
          set -euo pipefail
          latest_json="$RUNNER_TEMP/previous-channel.json"
          previous="$(node - "$latest_json" <<'NODE'
          const fs = require('fs');
          process.stdout.write(JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).tag_name || '');
          NODE
          )"
          if ! git diff --quiet "refs/ait-release-ancestry/$previous..HEAD" -- appview/src/db.ts; then
            # Only this reviewed additive migration is approved (see
            # specs/reliable-follow-indexing.md). All other transitions refuse.
            old_schema="$(git show "refs/ait-release-ancestry/$previous:appview/src/db.ts" | sha256sum | cut -d ' ' -f 1)"
            new_schema="$(sha256sum appview/src/db.ts | cut -d ' ' -f 1)"
            if [ "$previous" != v0.1.40 ] || [ "$RELEASE_VERSION" != 0.1.41 ] ||
               [ "$old_schema" != 71fc964bd38ea19ec745b737d6eae096687815c5ff09493975dd268843b6e452 ] ||
               [ "$new_schema" != bbacf4a06705ba8a69d26f87da01f8b6328d383e7213f9e8828506daafbc3257 ]; then
              echo 'AppView migration surface changed; use a separately reviewed data-migration and recovery design.' >&2
              exit 1
            fi
          fi
      - name: Prepare inspected draft
        if: env.RELEASE_OPERATION == 'prepare'
        env:
          RELEASE_TAG: ${{ steps.asset.outputs.tag }}
          RELEASE_ASSET: ${{ steps.asset.outputs.asset }}
        run: |
          set -euo pipefail
          draft_created=0
          on_prepare_failure() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$draft_created" -eq 1 ]; then
              echo "recovery: gh release delete '$RELEASE_TAG' --yes" >&2
              echo "recovery: git push origin ':refs/tags/$RELEASE_TAG'" >&2
            fi
            exit "$rc"
          }
          trap on_prepare_failure EXIT
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/$GITHUB_REF_NAME")"
          channel_args=(--latest=false)
          if [ "$GITHUB_REF_NAME" = build/private-peer-integration ]; then channel_args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET#install.sh" "${channel_args[@]}" \
            --draft --generate-notes --target "$(git rev-parse HEAD)" \
            --title "AIT $RELEASE_TAG"
          draft_created=1
          draft_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq '.databaseId')"
          test -n "$draft_id"
          draft_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
          node - "$draft_json" "$(git rev-parse HEAD)" "$(shasum -a 256 "$RELEASE_ASSET" | awk '{print $1}')" <<'NODE'
          const [raw, expectedCommit, expectedDigest] = process.argv.slice(2);
          const r = JSON.parse(raw);
          const a = (r.assets || []).find(x => x.name === 'install.sh');
          if (!r.draft || r.prerelease !== (process.env.GITHUB_REF_NAME === 'build/private-peer-integration') || r.target_commitish !== expectedCommit || !a || a.digest !== `sha256:${expectedDigest}`) process.exit(1);
          NODE
          gh release view "$RELEASE_TAG" --json url,tagName,targetCommitish,isDraft
      - name: Publish inspected immutable release
        if: env.RELEASE_OPERATION == 'publish'
        env:
          RELEASE_TAG: ${{ steps.asset.outputs.tag }}
          RELEASE_ASSET: ${{ steps.asset.outputs.asset }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/$GITHUB_REF_NAME")"
          draft_target="$(gh release view "$RELEASE_TAG" --json databaseId,targetCommitish,isDraft --jq '(.databaseId|tostring)+"\t"+.targetCommitish+"\t"+(.isDraft|tostring)')"
          draft_id="${draft_target%%$'\t'*}"
          draft_target="${draft_target#*$'\t'}"
          test "${draft_target%%$'\t'*}" = "$(git rev-parse HEAD)"
          test "${draft_target#*$'\t'}" = true
          test -n "$draft_id"
          draft_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
          node - "$draft_json" "$(git rev-parse HEAD)" "$(shasum -a 256 "$RELEASE_ASSET" | awk '{print $1}')" <<'NODE'
          const [raw, expectedCommit, expectedDigest] = process.argv.slice(2);
          const r = JSON.parse(raw);
          const a = (r.assets || []).find(x => x.name === 'install.sh');
          if (!r.draft || r.prerelease !== (process.env.GITHUB_REF_NAME === 'build/private-peer-integration') || r.target_commitish !== expectedCommit || !a || a.digest !== `sha256:${expectedDigest}`) process.exit(1);
          NODE
          if [ "$GITHUB_REF_NAME" = build/private-peer-integration ]; then
            latest_before="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id')"
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=true --latest=false
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id')" = "$latest_before"
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id")"
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
          fi
          node - "$release_json" "$RELEASE_TAG" "$(git rev-parse HEAD)" "$(shasum -a 256 "$RELEASE_ASSET" | awk '{print $1}')" <<'NODE'
          const [raw, expectedTag, expectedCommit, expected] = process.argv.slice(2);
          const r = JSON.parse(raw);
          if (r.tag_name !== expectedTag || r.draft || r.prerelease !== (process.env.GITHUB_REF_NAME === 'build/private-peer-integration') || r.immutable !== true || r.target_commitish !== expectedCommit || r.html_url !== `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${expectedTag}`) process.exit(1);
          const a = (r.assets || []).find(x => x.name === 'install.sh');
          if (!a || a.digest !== `sha256:${expected}`) process.exit(1);
          NODE
