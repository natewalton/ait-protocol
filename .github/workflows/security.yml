name: AIT security

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ait-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    name: Security checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine security relevance
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/security-changed-paths"
          # Only prose/license changes may skip; new config paths default to checked.
          if grep -Eq '^(docs/security\.md|specs/security-release-and-continuous-checks\.md)$' "$RUNNER_TEMP/security-changed-paths" ||
             grep -Ev '^(README\.md|LICENSE|docs/.*\.md|specs/.*\.md)$' "$RUNNER_TEMP/security-changed-paths" > /dev/null; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'Security checks: no relevant changes.'
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 24
      - name: Test candidate security boundaries
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          for workspace in plc pds appview mcp; do
            npm --prefix "$workspace" ci --no-audit
          done
          npm --prefix appview run build
          npm --prefix mcp run build
          baseline="$RUNNER_TEMP/ait-upgrade-baseline"
          mkdir -p "$baseline"
          git archive b4ea412c50caf3a21f5e270f65b20906dc76f0de pds | tar -x -C "$baseline"
          npm --prefix "$baseline/pds" ci --no-audit
          node pds/scripts/upgrade-compatibility-test.mjs --baseline "$baseline"
          if [ -f appview/src/localFeed.mjs ]; then
            node mcp/scripts/stack-migration-test.mjs
          else
            echo 'Verified peer stack uses the actual two-PDS link journey below.'
          fi
          node appview/scripts/identity-fetch-test.mjs
          node mcp/scripts/list-tools-test.mjs
          node appview/scripts/operator-identity-test.mjs
          node appview/scripts/startup-readiness-test.mjs
          node bin/managed-ports-test.mjs
          if [ "${GITHUB_BASE_REF:-}" = build/private-peer-integration ]; then
            (cd appview && node --import tsx scripts/peer-projection-test.mjs)
            (cd appview && node --import tsx scripts/peer-feed-test.mjs)
            (cd appview && node --import tsx scripts/peer-lifecycle-test.mjs)
            (cd mcp && node --import tsx scripts/peer-mentions-test.mjs)
            brew list --versions postgresql@17 >/dev/null || brew install postgresql@17
            node appview/scripts/peer-link-test.mjs
            npm install --prefix "$RUNNER_TEMP/iroh-stock" --no-audit --no-fund @number0/iroh@1.2.0
            IROH_STOCK_BINDING="$RUNNER_TEMP/iroh-stock/node_modules/@number0/iroh/index.js" node appview/scripts/peer-link-test.mjs --policy-controls
            node appview/scripts/peer-link-test.mjs --connect-bound
          fi
          node mcp/scripts/push-mode-test.mjs
          node mcp/scripts/handles-test.mjs
          node mcp/scripts/claude-background-test.mjs
          node mcp/scripts/channel-sink-test.mjs
          node pds/scripts/default-mail-scope-test-test.mjs
          node pds/scripts/default-mail-scope-test.mjs --candidate "$GITHUB_WORKSPACE" --json
          node pds/scripts/xml-parser-test.cjs
          node pds/scripts/dependency-security-test.mjs --candidate "$GITHUB_WORKSPACE" --json
          node bin/check-advisories-test.mjs
          node bin/security-workflow-test.mjs
          node bin/check-native-advisories-test.mjs
          GITHUB_TOKEN="${{ github.token }}" bin/check-advisories.sh --candidate "$GITHUB_WORKSPACE" --configuration managed-default-json
